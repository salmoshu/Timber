<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Timber Logo：Kimi 式 squircle + 树干 · 开枝散叶
       主干自下而上生长，主枝向两侧展开，枝端叶片结果；树冠最高处的蓝点 = 此刻最新的一次提交 -->
  <defs>
    <linearGradient id="timber-shell" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#1A1A1A"/>
      <stop offset="1" stop-color="#0D0D0D"/>
    </linearGradient>
  </defs>

  <!-- squircle 底板 -->
  <path d="M256 8 C396 8 504 116 504 256 C504 396 396 504 256 504 C116 504 8 396 8 256 C8 116 116 8 256 8 Z"
        fill="url(#timber-shell)" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>

  <!-- 主干 -->
  <path d="M 256 374 L 256 176" fill="none" stroke="#FFFFFF" stroke-opacity="0.95"
        stroke-width="52" stroke-linecap="round"/>
  <!-- 一级分枝 -->
  <path d="M 256 300 L 162 192" fill="none" stroke="#FFFFFF" stroke-opacity="0.82"
        stroke-width="30" stroke-linecap="round"/>
  <path d="M 256 272 L 352 178" fill="none" stroke="#FFFFFF" stroke-opacity="0.82"
        stroke-width="30" stroke-linecap="round"/>
  <!-- 二级分枝 -->
  <path d="M 212 250 L 110 210" fill="none" stroke="#FFFFFF" stroke-opacity="0.64"
        stroke-width="18" stroke-linecap="round"/>
  <path d="M 304 225 L 388 194" fill="none" stroke="#FFFFFF" stroke-opacity="0.64"
        stroke-width="18" stroke-linecap="round"/>

  <!-- 枝端叶片 -->
  <circle cx="162" cy="192" r="21" fill="#FFFFFF" fill-opacity="0.86"/>
  <circle cx="352" cy="178" r="21" fill="#FFFFFF" fill-opacity="0.86"/>
  <circle cx="110" cy="210" r="15" fill="#FFFFFF" fill-opacity="0.68"/>
  <circle cx="388" cy="194" r="15" fill="#FFFFFF" fill-opacity="0.68"/>

  <!-- 此刻：树冠最高处 / Kimi 蓝点 -->
  <circle cx="256" cy="146" r="30" fill="#1783FF"/>
</svg>
