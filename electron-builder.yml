appId: com.winchell.timber
productName: Timber
directories:
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: sidecar/bin
    to: sidecar
  - from: vendor/archify
    to: vendor/archify
  - from: release-notes.md
    to: release-notes.md
  - from: vendor/marktext-muya/LICENSE
    to: licenses/MarkText-LICENSE
  - from: vendor/marktext-muya/src/assets/styles/fonts
    to: licenses/fonts
    filter:
      - '*LICENSE*'
      - NOTO.md
publish:
  - provider: github
    owner: salmoshu
    repo: Timber
    releaseType: release
win:
  target:
    - nsis
  # 安装包名不含空格：latest.yml 的 url、GitHub 资产名与实际文件三者一致，
  # 否则 GitHub 把空格资产名转成点号后，electron-updater 按空格→连字符拼出的
  # 下载地址会 404（v0.2.0/v0.2.1 即踩此坑）
  artifactName: "Timber-Setup-${version}.exe"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: build/file-associations.nsh
